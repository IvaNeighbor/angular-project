<footer class="footer">
  <div class="container">
    <div class="footer__container">
      <nav class="footer__nav">
        <div class="footer__logo">
          <a href="#"><img src="/assets/images/Logo.svg" alt="Travel Logo" /></a>
          <p class="footer__text">Copyright &copy; Travellian 2020 All rights reserved</p>
        </div>

        <div class="footer__menu">
          <h3 class="footer__titles">Menu</h3>
          <app-top-menu [theme]="'footer'"></app-top-menu>
        </div>
      </nav>

      <div class="footer__info">
        <h3 class="footer__titles">Information</h3>

        <ul class="footer__list">
          <li><a href="#" class="link-decor">Destinations</a></li>
          <li><a href="#" class="link-decor">Supports</a></li>
          <li>
            <a href="#" class="link-decor">Terms & Conditions</a>
          </li>
          <li><a href="#" class="link-decor">Privacy</a></li>
        </ul>
      </div>

      <address class="footer__address">
        <div class="footer__contacts">
          <h3 class="footer__titles">Contact Info</h3>

          <ul class="footer__list">
            <li>
              <a href="tel:+ 380960000007" class="link-decor">+ 38 (096) 000 00 07</a>
            </li>

            <li>
              <a href="mailto:info@travellian.com" class="link-decor">info@travellian.com</a>
            </li>

            <li>
              <a
                href="https://maps.app.goo.gl/5otGkDNS7KPF3h2NA"
                target="_blank"
                rel="noopener noreferrer"
                class="link-decor"
                >Прип'ять, Рудий ліс
              </a>
            </li>
          </ul>
        </div>

        <div class="footer__social">
          <h3 class="footer__titles">Follow us on</h3>

          <a href="#">
            <svg class="footer__social-icon" width="32px" height="32px">
              <use href="/assets/images/icons.svg#icon-facebook"></use>
            </svg>
          </a>

          <a href="#">
            <svg class="footer__social-icon" width="32px" height="32px">
              <use href="/assets/images/icons.svg#icon-instagram"></use>
            </svg>
          </a>

          <a href="#">
            <svg class="footer__social-icon" width="32px" height="32px">
              <use href="/assets/images/icons.svg#icon-pinterest"></use>
            </svg>
          </a>

          <a href="#">
            <svg
              class="footer__social-icon footer__social-icon--lastWithout"
              width="32px"
              height="32px"
            >
              <use href="/assets/images/icons.svg#icon-twitter"></use>
            </svg>
          </a>
        </div>
      </address>
    </div>
  </div>
</footer>
