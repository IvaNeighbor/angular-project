<div class="offer-card">
  <img [src]="offer.bgImage" class="offer-cards__img" alt="{{ offer.country }}" />
  <h3>{{ offer.country }}</h3>
  <p>{{ offer.description }}</p>
  <p>
    Price:
    <span
      [ngClass]="{
        'offer-card__price': !offer.discount,
        'offer-card__price--discount': offer.discount
      }"
      >{{ '$' + offer.price }}
    </span>
    <span *ngIf="offer.discount" class="offer-card__slash">/</span>
    <span *ngIf="offer.discount" class="offer-card__discount-price">{{
      getDiscountPrice().toFixed(2)
    }}</span>
  </p>
  <p *ngIf="offer.discount" class="offer-card__discount">{{ offer.discount }}% Off</p>
  <p
    [ngClass]="{
      'offer-card__avaible': offer.freeSeats,
      'offer-card__avaible--not': !offer.freeSeats
    }"
  >
    Avaible: {{ offer.freeSeats ? 'Yes' : 'No' }}
  </p>
  <p>Free sats: {{ offer.freeSeats > 0 ? offer.freeSeats + ' free seats left' : 'None' }}</p>
  <button type="button" class="offer-cards__book-button" [disabled]="!offer.freeSeats">Book</button>
  <div>
    <button type="button" class="offer-cards__decrement-button" (click)="decrement()">-</button>
    <p>{{ numberOfReserves }}</p>
    <button type="button" class="offer-cards__increment-button" (click)="increment()">+</button>
  </div>
  <button type="button">Details</button>
</div>
