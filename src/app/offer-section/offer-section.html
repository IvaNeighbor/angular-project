<section class="offer-section section">
  <div class="container">
    <div class="offer-section__title-container">
      <app-search (searchTextChanged)="getSearchText($event)"></app-search>
      <a
        routerLink="/create"
        style="
          display: inline-block;
          background-color: #ff7b54;
          color: white;
          padding: 10px 24px;
          position: absolute;
          top: 54px;
          left: 350px;
          z-index: 10;
          border-radius: 50px;
          text-decoration: none;
          box-shadow: 0 4px 10px rgba(255, 123, 84, 0.3);
          transition: transform 0.2s;
          cursor: pointer;
        "
        onmouseover="this.style.transform='scale(1.05)'"
        onmouseout="this.style.transform='scale(1)'"
      >
        + Add New Tour
      </a>
      <h2 class="offer-section__title section__title">special offer</h2>
      <p class="offer-section__subtitle-text">Check out our special offer and discounts</p>
    </div>
    <app-offer-cards [searchText]="searchText"></app-offer-cards>
  </div>
</section>
