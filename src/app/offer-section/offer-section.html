<section class="offer-section section">
  <div class="container">
    <div class="offer-section__title-container">
      <app-search (searchTextChanged)="getSearchText($event)"></app-search>
      <h2 class="offer-section__title section__title">special offer</h2>
      <p class="offer-section__subtitle-text">Check out our special offer and discounts</p>
    </div>
    <app-offer-cards
      [searchText]="searchText"
      (selectedOfferEvent)="setSelectedOffer($event)"
    ></app-offer-cards>
    <app-travel-detail [offer]="selectedOffer"></app-travel-detail>
  </div>
</section>
