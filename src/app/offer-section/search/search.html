<form class="search__form" autocomplete="off" (submit)="$event.preventDefault()">
  <label class="search__label visually-hidden" for="search-field">Search</label>

  <input
    class="search__control"
    type="search"
    id="search-field"
    name="search-field"
    placeholder="Search"
    #searchInput
    (keyup.enter)="setSearchText()"
  />

  <button class="search__button-submit" type="button" (click)="setSearchText()">Search</button>
</form>
